      --white: #ffffff;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      background: var(--black) !important;
      color: var(--white) !important;
    }
    #app {
      background: var(--black) !important;
      color: var(--white) !important;
    }
    .font-display { font-family: 'Playfair Display', serif; }
    
    .bottom-nav {
      padding-bottom: calc(12px + var(--safe-bottom));
      background: #000 !important;
      border-top: 1px solid rgba(212,175,55,0.4) !important;
    }
    .floating-cart {
      bottom: calc(80px + var(--safe-bottom));
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .status-timeline::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 24px;
      bottom: 24px;
      width: 2px;
      background: #e5e7eb;
    }

    .thali-scene {
      perspective: 900px;
      perspective-origin: 50% 40%;
    }
    .thali-plate-3d {
      width: 280px;
      height: 280px;
      margin: 0 auto;
      position: relative;
      border-radius: 50%;
      transform-style: preserve-3d;
      transform: rotateX(28deg) rotateZ(0deg);
      background: radial-gradient(circle at 50% 42%, #f5e6c8 0%, #e8d4a8 25%, #d4b87a 45%, #c4a060 60%, #a88848 75%, #8a6e38 88%, #6b5428 100%);
      box-shadow: 0 25px 50px rgba(0,0,0,0.45), 0 10px 20px rgba(0,0,0,0.3), inset 0 -8px 20px rgba(0,0,0,0.15), inset 0 8px 16px rgba(255,255,255,0.35), 0 0 0 4px #c9a227, 0 0 0 7px #8a6e38, 0 0 0 10px #d4af37;
      animation: thaliFloat 4s ease-in-out infinite;
    }
    @keyframes thaliFloat {
      0%, 100% { transform: rotateX(28deg) translateY(0); }
      50% { transform: rotateX(28deg) translateY(-6px); }
    }
    .compartment-3d {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #fff9f0, #f0e4c8);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.12), 0 3px 8px rgba(0,0,0,0.2), 0 0 0 1.5px rgba(168, 136, 72, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform: translateZ(12px);
      overflow: hidden;
    }
    .compartment-3d.filled {
      transform: translateZ(18px) scale(1.08);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.1), 0 6px 14px rgba(0,0,0,0.25), 0 0 0 2px #d4af37;
    }
    .thali-center-3d {
      position: absolute;
      left: 50%; top: 50%;
      width: 68px; height: 68px;
      margin: -34px 0 0 -34px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #fff9f0, #e8d9b0);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.25), 0 0 0 2px rgba(168, 136, 72, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      transform: translateZ(20px);
      z-index: 5;
      overflow: hidden;
    }
    .thali-center-3d.filled {
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.1), 0 6px 16px rgba(0,0,0,0.3), 0 0 0 2.5px #d4af37;
    }

    input, textarea, select {
      background: #1a1a1a !important;
      color: #ffffff !important;
      border: 1px solid rgba(212,175,55,0.4) !important;
    }
    input::placeholder, textarea::placeholder {
      color: rgba(255,255,255,0.35) !important;
    }

    html, body, #app, #main-content, #main-content *, 
    main, main *, p, span, div, a, li, label, td, th, button {
      color: #ffffff !important;
    }

    h1, h2, h3, h4, .font-display, [class*="font-display"], .text-gold {

      border-top-color: #d4af37;

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBhZl84pL0CER7OtmR-8RIgrXJMILB59JM",
      authDomain: "hoteloowner.firebaseapp.com",
      projectId: "hoteloowner",
      storageBucket: "hoteloowner.firebasestorage.app",
      messagingSenderId: "299586039524",
      appId: "1:299586039524:web:c67bd4b2cee14d041706f1"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);

    // Live menu sync
    onSnapshot(collection(db, "restaurant_menu"), (snapshot) => {
      if (!snapshot.empty) {
        const liveDishes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const map = new Map();
        DEFAULT_MENU.forEach(item => map.set(item.id, item));
        liveDishes.forEach(item => map.set(item.id, item));
        MENU = Array.from(map.values());

        if (window.App && (window.App.getState().screen === "menu" || window.App.getState().screen === "home")) {
          window.App.navigate(window.App.getState().screen);
        }
      }
    });

    // Live Thali sync from Admin panel
    onSnapshot(doc(db, "restaurant_thali", "config"), (docSnap) => {
      if (docSnap.exists && docSnap.data().items) {
        THALI_OPTIONS = docSnap.data().items;
        if (window.App && window.App.getState().screen === "thali") {
          window.App.navigate("thali");
        }
      }
    });

    window.pushOrderToFirestore = async function(order) {
      try {
        const mappedItems = (order.items || []).map(function(i) {
          if (i.isCustomThali || i.thaliItems || (i.name && i.name.toLowerCase().includes("thali"))) {
            return {
              name: i.name,
              quantity: Number(i.qty || 1),
              price: Number(i.price || 0),
              isCustomThali: true,
              thaliItems: i.thaliItems || (i.custom ? i.custom.split(", ") : [])
            };
          }
          return {
            name: i.name,
            quantity: Number(i.qty || 1),
            price: Number(i.price || 0)
          };
        });

        const docRef = await addDoc(collection(db, "orders"), {
          tableNumber: order.table,
          customerName: order.customerName || "",
          phone: order.customerPhone || "",
          items: mappedItems,
          totalAmount: Number(order.total || 0),
          status: "new",
          specialInstructions: order.notes || "",
          timestamp: serverTimestamp()
        });

        onSnapshot(doc(db, "orders", docRef.id), (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            const statusStr = (data.status || "new").toLowerCase();
            const statusMap = { "new": 0, "preparing": 2, "ready": 3, "serving": 4, "served": 5, "completed": 5 };
            const statusNum = statusMap[statusStr] !== undefined ? statusMap[statusStr] : 0;
            if (window.App) {
              window.App.updateOrderStatusFromCloud(order.id, statusNum, statusStr);
            }
          }
        });
      } catch (e) {
        console.error("Firestore order push failed:", e);
      }
    };
  </script>

    function updateStoredOrder(id, patch) {
      var list = loadOrders();
      list = list.map(function(o) {
        if (o.id === id) { for (var k in patch) o[k] = patch[k]; }

      });
      localStorage.setItem("muskan_orders", JSON.stringify(list));

    function formatPrice(n) { return "₹" + n; }

    function buildUpiUrl(amount) {
      var am = (amount != null && amount > 0) ? Number(amount).toFixed(2) : "";
      var tn = encodeURIComponent("Hotel Muskan " + (state.table || "Order"));
      var pn = encodeURIComponent(UPI_NAME);
      var pa = UPI_VPA;
      var q = "pa=" + encodeURIComponent(pa) + "&pn=" + pn + "&cu=INR&tn=" + tn;
      if (am) q += "&am=" + am;
      return {
        pa: pa,
        amount: am,
        upi: "upi://pay?" + q,
        gpay: "tez://upi/pay?" + q,
        phonepe: "phonepe://pay?" + q,
        paytm: "paytmmp://pay?" + q,
        navi: "intent://pay?" + q + "#Intent;scheme=upi;package=com.navi.finance;end"
      };
    }

    function upiQrImageUrl(amount, size) {
      size = size || 220;
      var links = buildUpiUrl(amount);
      return "https://api.qrserver.com/v1/create-qr-code/?size=" + size + "x" + size + "&margin=8&data=" + encodeURIComponent(links.upi);
    }

    function tryOpenSpecificUpi(method, amount) {
      var links = buildUpiUrl(amount);
      showToast("Opening Payment App...");
      var targetUrl = links.upi;
      if (method === "gpay") targetUrl = links.gpay;
      else if (method === "phonepe") targetUrl = links.phonepe;
      else if (method === "paytm") targetUrl = links.paytm;
      else if (method === "navi") targetUrl = links.navi;

      var a = document.createElement("a");
      a.href = targetUrl;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(function() { try { document.body.removeChild(a); } catch(e) {} }, 500);
      return links;
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.querySelector("div").textContent = msg;
      el.classList.remove("hidden");
      setTimeout(() => el.classList.add("hidden"), 2500);
    }

    function thaliTotal() {
      let total = 0;
      let cal = 0;
      ["rice", "bread", "dal", "sabzi", "protein", "dessert"].forEach(k => {
        if (state.thali[k]) {
          const qty = state.thali[k].qty || 1;
          total += (state.thali[k].price || 0) * qty;
          cal += (state.thali[k].cal || 0) * qty;
        }
      });
      state.thali.sides.forEach(s => {
        const qty = s.qty || 1;
        total += (s.price || 0) * qty;
        cal += (s.cal || 0) * qty;
      });
      return { total, cal };
    }

        { key: "sabzi", label: "Sabzi" },
        { key: "protein", label: "Protein" },
        { key: "dessert", label: "Dessert" }
      ];

      return `
        <div class="px-4 pt-14 pb-4">
          <div class="flex items-center justify-between mb-1">
            <h1 class="font-display text-2xl font-bold">Build Your Thali</h1>
            <button onclick="App.randomThali()" class="text-[10px] px-2 py-1 rounded-full border border-yellow-500/50" style="color:#d4af37">🎲 Surprise</button>
          </div>
          <p class="text-sm mb-5" style="color:rgba(255,255,255,0.6)">Tap items to place them on the plate</p>

          <div class="thali-scene mb-8 mt-2">
            <div class="thali-plate-3d">
              <div class="thali-center-3d ${state.thali.protein ? 'filled' : ''}">
                ${state.thali.protein
                  ? (state.thali.protein.img ? `<img src="${state.thali.protein.img}" class="food-item-enter w-full h-full object-cover" alt=""/>` : `<span style="font-size:24px">${state.thali.protein.emoji || '🧀'}</span>`)
                  : `<span style="font-size:11px;color:#8a6e38;text-align:center;line-height:1.2">Main</span>`}
              </div>
              ${compartments.filter(c => c.key !== "protein").map((c, i) => {
                const angle = (i * 60) - 90;
                const rad = (angle * Math.PI) / 180;
                const r = 92;
                const x = Math.cos(rad) * r;
                const y = Math.sin(rad) * r;
                const item = state.thali[c.key];
                return `
                  <div class="compartment-3d ${item ? 'filled' : ''}"
                       style="left:50%;top:50%;margin-left:-28px;margin-top:-28px;transform:translate(${x}px, ${y}px) translateZ(12px);">
                    ${item
                      ? (item.img ? `<img src="${item.img}" class="food-item-enter w-full h-full object-cover" alt=""/>` : `<span style="font-size:18px">${item.emoji || '🍲'}</span>`)
                      : `<span style="font-size:9px;color:#a88848;text-align:center;padding:2px">${c.label}</span>`}
                  </div>`;
              }).join("")}
              ${state.thali.sides.length ? `
              <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%) translateZ(15px);display:flex;gap:4px;z-index:6">
                ${state.thali.sides.map(s => s.img 
                  ? `<img src="${s.img}" class="w-6 h-6 rounded-full object-cover shadow border border-gold-500" alt=""/>` 
                  : `<span style="font-size:14px">${s.emoji}</span>`).join("")}
              </div>` : ""}
            </div>
            <p style="text-align:center;font-size:10px;color:#c9a227;margin-top:12px">↻ 3D Thali — tap items below to fill</p>
          </div>

          <div class="bg-neutral-900 border border-gold-500/30 rounded-2xl p-4 mb-5 flex justify-between items-center text-white">
            <div>
              <div class="text-xs" style="color:rgba(255,255,255,0.6)">Your Thali</div>
              <div class="font-bold text-lg text-yellow-400">${formatPrice(total)}</div>
              <div class="text-xs" style="color:rgba(255,255,255,0.6)">${cal} kcal</div>
            </div>
            <button onclick="App.addThaliToCart()" class="bg-gold-500 text-black font-semibold px-5 py-2.5 rounded-full text-sm ${total === 0 ? "opacity-40 pointer-events-none" : ""}">
              Add to Cart
            </button>
          </div>

          ${Object.entries(THALI_OPTIONS).map(([key, options]) => {
            const labels = {
              rice: "Rice / Pulao",
              bread: "Roti / Naan",
              dal: "Dal",
              sabzi: "Sabzi",
              protein: "Main Protein",
              sides: "Sides",
              dessert: "Dessert"
            };
            const isMulti = key === "sides";
            return `
              <div class="mb-4">
                <h4 class="text-sm font-semibold mb-2">${labels[key]}</h4>
                <div class="grid grid-cols-2 gap-2">
                  ${options.map(opt => {
                    const selItem = isMulti
                      ? state.thali.sides.find(s => s.id === opt.id)
                      : (state.thali[key]?.id === opt.id ? state.thali[key] : null);
                    const selected = !!selItem;
                    const isOut = opt.available === false;
                    const itemQty = selItem ? (selItem.qty || 1) : 1;

                    return `
                      <div class="p-2 rounded-xl text-xs font-medium border flex flex-col justify-between transition text-left
                          ${isOut ? 'opacity-40 bg-neutral-900 border-neutral-800' : selected ? "bg-gold-500 text-black border-gold-500" : "bg-neutral-900 border-gold-500/20 text-white"}">
                        
                        <div class="flex items-center gap-2 cursor-pointer" onclick="${isOut ? '' : `App.selectThaliItem('${key}', '${opt.id}')`}">
                          ${opt.img ? `<img src="${opt.img}" class="w-8 h-8 rounded-lg object-cover flex-shrink-0" alt=""/>` : `<span class="text-lg">${opt.emoji}</span>`}
                          <div class="min-w-0 flex-1">
                            <div class="truncate font-semibold ${selected ? 'text-black' : 'text-white'}">${opt.name} ${isOut ? '(Out)' : ''}</div>
                            <div class="text-[10px] ${selected ? 'text-black/80' : 'text-stone-400'}">${formatPrice(opt.price)}</div>
                          </div>
                        </div>

                        ${selected ? `
                          <div class="flex items-center justify-between mt-2 pt-1.5 border-t border-black/20" onclick="event.stopPropagation()">
                            <span class="text-[10px] font-bold text-black uppercase">Qty:</span>
                            <div class="flex items-center gap-1.5">
                              <button onclick="App.changeThaliItemQty('${key}', '${opt.id}', -1)" class="w-5 h-5 rounded-full bg-black text-white flex items-center justify-center text-xs font-bold leading-none active:scale-90">−</button>
                              <span class="font-bold text-xs text-black min-w-[14px] text-center">${itemQty}</span>
                              <button onclick="App.changeThaliItemQty('${key}', '${opt.id}', 1)" class="w-5 h-5 rounded-full bg-black text-white flex items-center justify-center text-xs font-bold leading-none active:scale-90">+</button>
                            </div>
                          </div>
                        ` : ''}

                      </div>
                    `;
                  }).join("")}
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

            <div class="mt-3 text-xs font-bold text-white">${UPI_VPA}</div>

          <h3 class="font-semibold text-sm mb-3">Or Choose Method</h3>

            ${methods.map(m => `

          <button onclick="App.confirmPayment()" 
            class="w-full bg-gold-500 text-black font-semibold py-3.5 rounded-2xl text-base shadow-lg ${!state.paymentMethod ? 'opacity-40 pointer-events-none' : ''}">

    // ========== EXPOSED API ==========
    window.App = {
      getState() { return state; },

      updateOrderStatusFromCloud(orderId, numericStatus, statusText) {
        state.orderStatus = numericStatus;
        if (state.screen === "order") App.navigate("order");
        if (statusText.toLowerCase() === "ready") {
          showToast("🔔 Your food is READY to be served!");
        }
      },

      async initAppFlow() {
        if ("Notification" in window && Notification.permission !== "granted") {
          Notification.requestPermission();
        }
        setTimeout(function () {
          const loadingScreen = document.getElementById("loading-screen");
          loadingScreen.style.opacity = "0";
          setTimeout(function () {
            loadingScreen.style.display = "none";
            if (!state.customerPhone) {
              const loginScreen = document.getElementById("login-screen");
              loginScreen.classList.remove("hidden");
              loginScreen.classList.add("flex");
            } else {
              App.showMainApp();
            }
          }, 600);
        }, 1800);
      },

      showMainApp() {
        const app = document.getElementById("app");
        app.classList.remove("hidden");
        updateProfileUI();
        App.navigate("home");
      },

      submitInitialLogin() {
        const nameInput = document.getElementById("initial-login-name");
        const phoneInput = document.getElementById("initial-login-phone");
        const phone = (phoneInput.value || "").trim().replace(/[^0-9]/g, "");
        const name = (nameInput.value || "").trim();

        if (phone.length < 10) {
          showToast("Please enter a valid 10-digit number");
          return;
        }

        state.customerPhone = phone;
        state.customerName = name || "Customer";
        localStorage.setItem("muskan_user_phone", state.customerPhone);
        localStorage.setItem("muskan_user_name", state.customerName);

        const loginScreen = document.getElementById("login-screen");
        loginScreen.classList.add("hidden");
        loginScreen.classList.remove("flex");

        App.showMainApp();
        showToast("Welcome, " + state.customerName);
      },

      skipLogin() {
        const loginScreen = document.getElementById("login-screen");
        loginScreen.classList.add("hidden");
        loginScreen.classList.remove("flex");
        App.showMainApp();
      },

      navigate(screen) {
        state.screen = screen;
        setActiveNav(screen);
        const main = document.getElementById("main-content");
        let html = "";
        switch (screen) {
          case "home": html = renderHome(); break;
          case "thali": html = renderThali(); break;
          case "menu": html = renderMenu(); break;
          case "myorders": html = renderMyOrders(); break;
          case "cart": html = renderCart(); break;
          case "payment": html = renderPayment(); break;
          case "order": html = renderOrderTracking(); break;
          default: html = renderHome();
        }
        main.innerHTML = html;
        window.scrollTo(0, 0);
        updateCartUI();
        updateProfileUI();
      },

      setTip(amount) {
        state.tipAmount = amount;
        App.navigate("cart");
      },

      reorderItems(orderId) {
        const orders = loadOrders();
        const o = orders.find(x => x.id === orderId);
        if (!o || !o.items) return;
        state.cart = [...o.items];
        updateCartUI();
        showToast("Previous order added to cart!");
        App.navigate("cart");
      },

      openLoginModal(onSuccessNav) {
        const modal = document.getElementById("modal-container");
        modal.innerHTML = `
          <div class="bg-neutral-900 border border-gold-500/40 rounded-2xl p-5 w-full max-w-xs text-white my-auto shadow-2xl">
            <h3 class="font-bold text-base mb-1 text-yellow-400 text-center">Customer Login</h3>
            <p class="text-[11px] text-stone-400 text-center mb-4">Instant phone login.</p>
            
            <div class="space-y-3 mb-4">
              <div>
                <label class="block text-[10px] text-yellow-400 uppercase font-bold mb-1">Your Name</label>
                <input type="text" id="login-name-input" placeholder="e.g. Rahul" value="${state.customerName}" 
                       class="w-full text-xs px-3 py-2 rounded-xl focus:outline-none" />
              </div>
              <div>
                <label class="block text-[10px] text-yellow-400 uppercase font-bold mb-1">Phone Number (10 Digits)</label>
                <input type="tel" id="login-phone-input" placeholder="e.g. 9876543210" maxlength="10" value="${state.customerPhone}" 
                       class="w-full text-xs px-3 py-2 rounded-xl focus:outline-none" />
              </div>
            </div>

            <button onclick="App.saveLogin('${onSuccessNav || ''}')" class="w-full bg-gold-500 text-black py-2.5 rounded-xl text-xs font-bold mb-2">
              Save & Continue
            </button>
            <button onclick="App.closeModal()" class="w-full text-center text-xs text-stone-400 py-1">Cancel</button>
          </div>
        `;
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      },

      saveLogin(onSuccessNav) {
        const phoneInput = document.getElementById("login-phone-input");
        const nameInput = document.getElementById("login-name-input");
        const phone = (phoneInput.value || "").trim().replace(/[^0-9]/g, "");
        const name = (nameInput.value || "").trim();

        if (phone.length < 10) {
          showToast("Please enter a valid 10-digit number");
          return;
        }

        state.customerPhone = phone;
        state.customerName = name || "Guest";
        localStorage.setItem("muskan_user_phone", state.customerPhone);
        localStorage.setItem("muskan_user_name", state.customerName);

        App.closeModal();
        updateProfileUI();
        showToast("Logged in as " + state.customerPhone);

        if (onSuccessNav) App.navigate(onSuccessNav);
        else App.navigate(state.screen);
      },

      closeModal() {
        const modal = document.getElementById("modal-container");
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      },

      proceedToCheckout() {
        if (!state.customerPhone) {
          App.openLoginModal('payment');
          return;
        }
        App.navigate('payment');
      },

      handleSearch(q) {
        state.searchQuery = q;
        const main = document.getElementById("main-content");
        if (state.screen === 'menu') main.innerHTML = renderMenu();
      },

      setFilter(type) {
        state.activeFilter = type;
        const main = document.getElementById("main-content");
        if (state.screen === 'menu') main.innerHTML = renderMenu();
      },

      addToCart(id) {
        const item = MENU.find(m => m.id === id);
        if (!item || item.available === false) return;
        const existing = state.cart.find(c => c.id === id && !c.custom);
        if (existing) existing.qty++;
        else state.cart.push({ ...item, qty: 1, name: item.name });
        updateCartUI();
        showToast("Added to cart ✓");
      },

      addHalf(id) {
        const item = MENU.find(m => m.id === id);
        if (!item || !item.halfPrice || item.available === false) return;
        const halfName = item.name + " (Half)";
        const existing = state.cart.find(c => c.id === id + "-half");
        if (existing) existing.qty++;
        else state.cart.push({ id: id + "-half", name: halfName, price: item.halfPrice, qty: 1, img: item.img, veg: item.veg });
        updateCartUI();
        showToast("Half plate added ✓");
      },

      updateQty(idx, delta) {
        state.cart[idx].qty += delta;
        if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
        App.navigate("cart");
      },

      selectThaliItem(category, id) {
        const options = THALI_OPTIONS[category];
        const item = options.find(o => o.id === id);
        if (!item || item.available === false) return;
        if (category === "sides") {
          const idx = state.thali.sides.findIndex(s => s.id === id);
          if (idx >= 0) state.thali.sides.splice(idx, 1);
          else state.thali.sides.push({ ...item, qty: 1 });
        } else {
          state.thali[category] = state.thali[category]?.id === id ? null : { ...item, qty: 1 };
        }
        App.navigate("thali");
      },

      changeThaliItemQty(category, id, delta) {
        if (category === "sides") {
          const item = state.thali.sides.find(s => s.id === id);
          if (item) {
            item.qty = (item.qty || 1) + delta;
            if (item.qty <= 0) state.thali.sides = state.thali.sides.filter(s => s.id !== id);
          }
        } else if (state.thali[category] && state.thali[category].id === id) {
          state.thali[category].qty = (state.thali[category].qty || 1) + delta;
          if (state.thali[category].qty <= 0) state.thali[category] = null;
        }
        App.navigate("thali");
      },

      addThaliToCart() {
        const { total } = thaliTotal();
        if (total === 0) return;
        const parts = [];
        ["rice", "bread", "dal", "sabzi", "protein", "dessert"].forEach(k => {
          if (state.thali[k]) {
            const q = state.thali[k].qty || 1;
            parts.push(q > 1 ? `${state.thali[k].name} (${q}x)` : state.thali[k].name);
          }
        });
        state.thali.sides.forEach(s => {
          const q = s.qty || 1;
          parts.push(q > 1 ? `${s.name} (${q}x)` : s.name);
        });

        state.cart.push({
          id: "custom-thali-" + Date.now(),
          name: "Custom Thali",
          price: total,
          qty: 1,
          img: state.thali.protein?.img || "https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=400&fit=crop",
          custom: parts.join(", "),
          isCustomThali: true,
          thaliItems: [...parts],
          veg: !state.thali.protein || state.thali.protein.veg !== false
        });
        state.thali = { rice: null, bread: null, dal: null, sabzi: null, protein: null, sides: [], dessert: null };
        updateCartUI();
        showToast("Thali added to cart!");
        App.navigate("cart");
      },

      selectPayment(method) {
        state.paymentMethod = method;
        App.navigate("payment");
      },

      directAppPay(method) {
        if (!state.customerPhone) {
          App.openLoginModal('payment');
          return;
        }
        var total = cartTotal();
        state.paymentMethod = method;
        tryOpenSpecificUpi(method, total);
        setTimeout(function() {
          App.executeOrderPlacement(method, total);
        }, 3000);
      },

      confirmPayment() {
        if (!state.customerPhone) {
          App.openLoginModal('payment');
          return;
        }
        if (!state.paymentMethod || state.cart.length === 0) {
          showToast("Please select payment method");
          return;
        }
        var total = cartTotal();

        if (["phonepe", "gpay", "paytm", "navi"].includes(state.paymentMethod)) {
          tryOpenSpecificUpi(state.paymentMethod, total);
          setTimeout(function() {
            App.executeOrderPlacement(state.paymentMethod, total);
          }, 2000);
          return;
        }

        App.executeOrderPlacement(state.paymentMethod, total);
      },

      executeOrderPlacement(method, total) {
        state.order = {
          id: "HM" + Math.floor(1000 + Math.random() * 9000),
          items: state.cart.slice(),
          notes: state.cookingNotes || "",
          tip: state.tipAmount || 0,
          total: total,
          table: state.table,
          customerPhone: state.customerPhone,
          customerName: state.customerName,
          time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
          payment: method,
          status: 0
        };
        saveOrder(state.order);

        if (typeof window.pushOrderToFirestore === "function") {
          window.pushOrderToFirestore(state.order);
        }

        state.cart = [];
        state.cookingNotes = '';
        state.tipAmount = 0;
        state.paymentMethod = null;
        updateCartUI();
        App.navigate("order");
        showToast("Order placed!");
      },

      downloadBillImage(orderId) {
        const orders = loadOrders();
        const o = orders.find(x => x.id === orderId) || state.order;
        if (!o) return;

        showToast("Generating Bill Image...");
        const renderContainer = document.getElementById("hidden-receipt-render");
        renderContainer.innerHTML = createReceiptHtml(o);

        html2canvas(renderContainer.firstElementChild, { scale: 2, backgroundColor: "#fffef8" }).then(function(canvas) {
          var link = document.createElement("a");
          link.download = "Hotel_Muskan_Bill_" + o.id + ".png";
          link.href = canvas.toDataURL("image/png");
          link.click();
          showToast("Bill Image Downloaded!");
        }).catch(function(err) {
          console.error(err);
          showToast("Error generating image");
        });
      },

      simulateQR() {
        state.table = "TABLE-" + prompt("Enter Table Number:", "12");
        document.getElementById("table-display-pill").textContent = state.table;
      }
    };

    try {
      var cartBtn = document.getElementById("floating-cart");
      if (cartBtn) cartBtn.addEventListener("click", function() { App.navigate("cart"); });
      document.querySelectorAll(".nav-btn").forEach(function(btn) {
        btn.addEventListener("click", function() { App.navigate(btn.dataset.screen); });
      });
    } catch (e) { console.error(e); }

    App.initAppFlow();
  })();
  </script>
</body>
</html>
