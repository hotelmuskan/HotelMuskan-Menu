<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            muskan: {
              50: '#faf8f0', 100: '#f5f0dc', 200: '#ebe0b8', 300: '#d4c48a',
              400: '#c9a84c', 500: '#b8943a', 600: '#9a7a2e', 700: '#7a6125',
              800: '#1a1a1a', 900: '#0d0d0d', 950: '#000000',
            },
            gold: {
              300: '#f5e6a3', 400: '#e8d48b', 500: '#d4af37', 600: '#c9a227', 700: '#a8841f',
            }
          },
          fontFamily: {
            display: ['Playfair Display', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --gold: #d4af37;
      --black: #0a0a0a;
      --white: #ffffff;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      background: var(--black) !important;
      color: var(--white) !important;
    }
    #app {
      background: var(--black) !important;
      color: var(--white) !important;
    }
    .font-display { font-family: 'Playfair Display', serif; }
    
    .bottom-nav {
      padding-bottom: calc(12px + var(--safe-bottom));
      background: #000 !important;
      border-top: 1px solid rgba(212,175,55,0.4) !important;
    }
    .floating-cart {
      bottom: calc(80px + var(--safe-bottom));
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .status-timeline::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 24px;
      bottom: 24px;
      width: 2px;
      background: #e5e7eb;
    }

    /* 3D Thali Scene */
    .thali-scene {
      perspective: 900px;
      perspective-origin: 50% 40%;
    }
    .thali-plate-3d {
      width: 280px;
      height: 280px;
      margin: 0 auto;
      position: relative;
      border-radius: 50%;
      transform-style: preserve-3d;
      transform: rotateX(28deg) rotateZ(0deg);
      background: radial-gradient(circle at 50% 42%, #f5e6c8 0%, #e8d4a8 25%, #d4b87a 45%, #c4a060 60%, #a88848 75%, #8a6e38 88%, #6b5428 100%);
      box-shadow: 0 25px 50px rgba(0,0,0,0.45), 0 10px 20px rgba(0,0,0,0.3), inset 0 -8px 20px rgba(0,0,0,0.15), inset 0 8px 16px rgba(255,255,255,0.35), 0 0 0 4px #c9a227, 0 0 0 7px #8a6e38, 0 0 0 10px #d4af37;
      animation: thaliFloat 4s ease-in-out infinite;
    }
    @keyframes thaliFloat {
      0%, 100% { transform: rotateX(28deg) translateY(0); }
      50% { transform: rotateX(28deg) translateY(-6px); }
    }
    .compartment-3d {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #fff9f0, #f0e4c8);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.12), 0 3px 8px rgba(0,0,0,0.2), 0 0 0 1.5px rgba(168, 136, 72, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform: translateZ(12px);
      overflow: hidden;
    }
    .compartment-3d.filled {
      transform: translateZ(18px) scale(1.08);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.1), 0 6px 14px rgba(0,0,0,0.25), 0 0 0 2px #d4af37;
    }
    .thali-center-3d {
      position: absolute;
      left: 50%; top: 50%;
      width: 68px; height: 68px;
      margin: -34px 0 0 -34px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #fff9f0, #e8d9b0);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.25), 0 0 0 2px rgba(168, 136, 72, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      transform: translateZ(20px);
      z-index: 5;
      overflow: hidden;
    }
    .thali-center-3d.filled {
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.1), 0 6px 16px rgba(0,0,0,0.3), 0 0 0 2.5px #d4af37;
    }

    input, textarea, select {
      background: #1a1a1a !important;
      color: #ffffff !important;
      border: 1px solid rgba(212,175,55,0.4) !important;
    }
    input::placeholder, textarea::placeholder {
      color: rgba(255,255,255,0.35) !important;
    }

    html, body, #app, #main-content, #main-content *, 
    main, main *, p, span, div, a, li, label, td, th, button {
      color: #ffffff !important;
    }

    h1, h2, h3, h4, .font-display, [class*="font-display"], .text-gold {
      color: #d4af37 !important;
    }
    .font-bold {
      color: #f0d78c !important;
    }

    button.bg-yellow-500, button.bg-gold-500, [class*="bg-gold-500"],
    button[class*="bg-[#d4af37]"], #floating-cart, #floating-cart * {
      background: var(--gold) !important;
      color: #000000 !important;
      font-weight: 700 !important;
    }

    .receipt-paper {
      background: #fffef8 !important;
      color: #000 !important;
      font-family: 'Courier New', Courier, monospace;
    }
    .receipt-paper * {
      color: #000 !important;
    }

    .loader-ring {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-radius: 50%;
      border-top-color: #d4af37;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

    function buildUpiUrl(amount) {
      var am = (amount != null && amount > 0) ? Number(amount).toFixed(2) : "";
      var tn = encodeURIComponent("Hotel Muskan " + (state.table || "Order"));
      var pn = encodeURIComponent(UPI_NAME);
      var pa = UPI_VPA;
      var q = "pa=" + encodeURIComponent(pa) + "&pn=" + pn + "&cu=INR&tn=" + tn;
      if (am) q += "&am=" + am;
      return {
        pa: pa,
        amount: am,
        upi: "upi://pay?" + q,
        gpay: "tez://upi/pay?" + q,
        phonepe: "phonepe://pay?" + q,
        paytm: "paytmmp://pay?" + q,
        navi: "intent://pay?" + q + "#Intent;scheme=upi;package=com.navi.finance;end"
      };
    }

    function upiQrImageUrl(amount, size) {
      size = size || 220;
      var links = buildUpiUrl(amount);
      return "https://api.qrserver.com/v1/create-qr-code/?size=" + size + "x" + size + "&margin=8&data=" + encodeURIComponent(links.upi);
    }

    function tryOpenSpecificUpi(method, amount) {
      var links = buildUpiUrl(amount);
      showToast(t("Opening Payment App...", "पेमेंट ऐप खुल रहा है..."));
      var targetUrl = links.upi;
      if (method === "gpay") targetUrl = links.gpay;
      else if (method === "phonepe") targetUrl = links.phonepe;
      else if (method === "paytm") targetUrl = links.paytm;
      else if (method === "navi") targetUrl = links.navi;

      var a = document.createElement("a");
      a.href = targetUrl;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(function() { try { document.body.removeChild(a); } catch(e) {} }, 500);
      return links;
    }

    function showToast(msg) {

      setTimeout(() => el.classList.add("hidden"), 2500);
    }

      state.thali.sides.forEach(s => { total += s.price; cal += s.cal || 0; });

      var text = "✨ *HOTEL MUSKAN - OFFICIAL BILL* ✨\n";
      text += "📍 Bhagwanpur, Vaishali, Bihar\n";
      text += "📞 +91 96086 35670\n";
      text += "👤 *Guest:* " + (order.customerName || "Customer") + " (" + (order.customerPhone || "N/A") + ")\n";
      text += "---------------------------------\n";
      text += "🧾 *Bill No:* " + order.id + "\n";
      text += "🪑 *Table:* " + order.table + "\n";
      text += "⏰ *Time:* " + (order.time || "Today") + "\n";
      text += "💳 *Payment:* " + (order.payment || "PAID").toUpperCase() + "\n";
      text += "---------------------------------\n";
      text += "*ITEMS:*\n";
      (order.items || []).forEach(function(it) {
        text += "▪ " + (it.qty || 1) + "x " + it.name + " = ₹" + ((it.price || 0) * (it.qty || 1)) + "\n";
      });
      text += "---------------------------------\n";
      text += "💰 *Total Amount:* ₹" + order.total + "\n\n";
      text += "🙏 *Thank you! Visit Hotel Muskan Again!*";

      var waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(text);
      if (cleanPhone.length >= 10) {
        waUrl = "https://api.whatsapp.com/send?phone=" + cleanPhone + "&text=" + encodeURIComponent(text);
      }
      window.open(waUrl, "_blank");

      const { total, cal } = thaliTotal();

      return `
        <div class="px-4 pt-14 pb-4">
          <div class="flex items-center justify-between mb-1">

          <p class="text-sm mb-5" style="color:rgba(255,255,255,0.6)">${t("Tap items to place them on the plate", "आइटम चुनकर प्लेट पर रखें")}</p>

          <div class="thali-scene mb-8 mt-2">
            <div class="thali-plate-3d">
              <div class="thali-center-3d ${state.thali.protein ? 'filled' : ''}">
                ${state.thali.protein
                  ? `<img src="${state.thali.protein.img}" class="food-item-enter w-full h-full object-cover" alt=""/>`

              </div>
              ${compartments.filter(c => c.key !== "protein").map((c, i) => {

              bread: t("Roti / Naan", "रोटी / नान"),

              protein: t("Main Protein", "मुख्य प्रोटीन"),

                      <button onclick="App.selectThaliItem('${key}', '${opt.id}')"

                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    // ========== EXPOSED API ==========
    window.App = {
      initAppFlow() {
        setTimeout(function () {
          const loadingScreen = document.getElementById("loading-screen");
          loadingScreen.style.opacity = "0";
          setTimeout(function () {
            loadingScreen.style.display = "none";
            if (!state.customerPhone) {
              const loginScreen = document.getElementById("login-screen");
              loginScreen.classList.remove("hidden");
              loginScreen.classList.add("flex");
            } else {
              App.showMainApp();
            }
          }, 600);
        }, 1800);
      },

      showMainApp() {
        const app = document.getElementById("app");
        app.classList.remove("hidden");
        updateProfileUI();
        App.navigate("home");
      },

      submitInitialLogin() {
        const nameInput = document.getElementById("initial-login-name");
        const phoneInput = document.getElementById("initial-login-phone");
        const phone = (phoneInput.value || "").trim().replace(/[^0-9]/g, "");
        const name = (nameInput.value || "").trim();

        if (phone.length < 10) {
          showToast("Please enter a valid 10-digit number");
          return;
        }

        state.customerPhone = phone;
        state.customerName = name || "Customer";
        localStorage.setItem("muskan_user_phone", state.customerPhone);
        localStorage.setItem("muskan_user_name", state.customerName);

        const loginScreen = document.getElementById("login-screen");
        loginScreen.classList.add("hidden");
        loginScreen.classList.remove("flex");

        App.showMainApp();
        showToast("Welcome, " + state.customerName);
      },

      skipLogin() {
        const loginScreen = document.getElementById("login-screen");
        loginScreen.classList.add("hidden");
        loginScreen.classList.remove("flex");
        App.showMainApp();
      },

      navigate(screen) {
        state.screen = screen;
        setActiveNav(screen);
        const main = document.getElementById("main-content");
        let html = "";
        switch (screen) {
          case "home": html = renderHome(); break;
          case "thali": html = renderThali(); break;
          case "menu": html = renderMenu(); break;
          case "myorders": html = renderMyOrders(); break;
          case "admin": html = renderAdmin(); break;
          case "cart": html = renderCart(); break;
          case "payment": html = renderPayment(); break;
          case "order": html = renderOrderTracking(); break;
          default: html = renderHome();
        }
        main.innerHTML = html;
        window.scrollTo(0, 0);
        updateCartUI();
        updateProfileUI();
      },

      setAdminTab(tab) {
        state.adminTab = tab;
        App.navigate('admin');
      },

      openAddDishModal() {

      saveNewDish() {
        const name = document.getElementById("new-dish-name").value.trim();
        const nameHi = document.getElementById("new-dish-name-hi").value.trim();
        const price = Number(document.getElementById("new-dish-price").value);
        const halfPrice = document.getElementById("new-dish-half").value ? Number(document.getElementById("new-dish-half").value) : null;
        const cat = document.getElementById("new-dish-cat").value;

        const img = document.getElementById("new-dish-img").value.trim() || "https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=400&fit=crop";

        if (!name || !price) {
          showToast("Name and Full Price are required");
          return;

          id: "m" + Date.now(),
          name: name,
          nameHi: nameHi || name,
          desc: name + " at Hotel Muskan",
          price: price,
          halfPrice: halfPrice,
          cat: cat,
          veg: veg,
          rating: 4.8,
          orders: 50,
          badge: "⭐ New",

      saveEditDish(dishId) {
        const name = document.getElementById("edit-dish-name").value.trim();
        const nameHi = document.getElementById("edit-dish-name-hi").value.trim();
        const price = Number(document.getElementById("edit-dish-price").value);
        const halfPrice = document.getElementById("edit-dish-half").value ? Number(document.getElementById("edit-dish-half").value) : null;
        const cat = document.getElementById("edit-dish-cat").value;
        const img = document.getElementById("edit-dish-img").value.trim();

        const updatedMenu = MENU.map(m => {
          if (m.id === dishId) {
            return { ...m, name, nameHi, price, halfPrice, cat, img };
          }
          return m;
        });

        saveMenuData(updatedMenu);
        App.closeModal();
        showToast("Dish updated successfully!");
        App.navigate("admin");
      },

      deleteDish(dishId) {
        if (!confirm("Are you sure you want to delete this dish from menu?")) return;
        const updatedMenu = MENU.filter(m => m.id !== dishId);
        saveMenuData(updatedMenu);
        showToast("Dish removed!");
        App.navigate("admin");
      },

      resetMenuToDefault() {
        if (!confirm("Reset all menu items to original factory defaults?")) return;
        saveMenuData(DEFAULT_MENU);
        showToast("Menu reset to defaults!");
        App.navigate("admin");
      },

      openLoginModal(onSuccessNav) {
        const modal = document.getElementById("modal-container");
        modal.innerHTML = `
          <div class="bg-neutral-900 border border-gold-500/40 rounded-2xl p-5 w-full max-w-xs text-white my-auto shadow-2xl">
            <h3 class="font-bold text-base mb-1 text-yellow-400 text-center">Customer Login</h3>
            <p class="text-[11px] text-stone-400 text-center mb-4">No OTP required. Instant phone login.</p>
            
            <div class="space-y-3 mb-4">
              <div>
                <label class="block text-[10px] text-yellow-400 uppercase font-bold mb-1">Your Name</label>

                       class="w-full text-xs px-3 py-2 rounded-xl focus:outline-none" />

              <div>
                <label class="block text-[10px] text-yellow-400 uppercase font-bold mb-1">Phone Number (10 Digits)</label>
                <input type="tel" id="login-phone-input" placeholder="e.g. 9876543210" maxlength="10" value="${state.customerPhone}" 
                       class="w-full text-xs px-3 py-2 rounded-xl focus:outline-none" />
              </div>
            </div>

            <button onclick="App.saveLogin('${onSuccessNav || ''}')" class="w-full bg-gold-500 text-black py-2.5 rounded-xl text-xs font-bold mb-2">
              Save & Continue
            </button>
            <button onclick="App.closeModal()" class="w-full text-center text-xs text-stone-400 py-1">Cancel</button>
          </div>
        `;
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      },

      saveLogin(onSuccessNav) {
        const phoneInput = document.getElementById("login-phone-input");
        const nameInput = document.getElementById("login-name-input");
        const phone = (phoneInput.value || "").trim().replace(/[^0-9]/g, "");
        const name = (nameInput.value || "").trim();

        if (phone.length < 10) {
          showToast("Please enter a valid 10-digit number");
          return;
        }

        state.customerPhone = phone;
        state.customerName = name || "Guest";
        localStorage.setItem("muskan_user_phone", state.customerPhone);
        localStorage.setItem("muskan_user_name", state.customerName);

        App.closeModal();
        updateProfileUI();
        showToast("Logged in as " + state.customerPhone);

        if (onSuccessNav) App.navigate(onSuccessNav);
        else App.navigate(state.screen);
      },

      logout() {
        localStorage.removeItem("muskan_user_phone");
        localStorage.removeItem("muskan_user_name");
        state.customerPhone = '';
        state.customerName = '';
        updateProfileUI();
        showToast("Logged out");
        App.navigate("home");
      },

      closeModal() {
        const modal = document.getElementById("modal-container");
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      },

        if (!state.customerPhone) {
          App.openLoginModal('payment');
          return;
        }
        App.navigate('payment');
      },

      toggleGst() {
        state.includeGst = !state.includeGst;
        showToast(state.includeGst ? t("GST Added (5%)", "जीएसटी जोड़ा गया") : t("GST Removed (0%)", "जीएसटी हटाया गया"));
        App.navigate("cart");
      },

      handleSearch(q) {
        state.searchQuery = q;
        const main = document.getElementById("main-content");
        if (state.screen === 'menu') main.innerHTML = renderMenu();
      },

      setFilter(type) {
        state.activeFilter = type;
        const main = document.getElementById("main-content");
        if (state.screen === 'menu') main.innerHTML = renderMenu();
      },

      addToCart(id) {
        const item = MENU.find(m => m.id === id);
        if (!item) return;
        const existing = state.cart.find(c => c.id === id && !c.custom);
        if (existing) existing.qty++;
        else state.cart.push({ ...item, qty: 1, name: state.lang === "hi" ? item.nameHi : item.name });
        updateCartUI();
        showToast(t("Added to cart", "कार्ट में जोड़ा गया") + " ✓");
      },

      addHalf(id) {
        const item = MENU.find(m => m.id === id);
        if (!item || !item.halfPrice) return;
        const halfName = (state.lang === "hi" ? item.nameHi : item.name) + " (Half)";
        const existing = state.cart.find(c => c.id === id + "-half");
        if (existing) existing.qty++;
        else state.cart.push({ id: id + "-half", name: halfName, price: item.halfPrice, qty: 1, img: item.img, veg: item.veg });
        updateCartUI();
        showToast(t("Half plate added", "हाफ प्लेट जुड़ी") + " ✓");
      },

      updateQty(idx, delta) {
        state.cart[idx].qty += delta;
        if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
        App.navigate("cart");
      },

      selectThaliItem(category, id) {
        const options = THALI_OPTIONS[category];
        const item = options.find(o => o.id === id);
        if (!item) return;
        if (category === "sides") {
          const idx = state.thali.sides.findIndex(s => s.id === id);
          if (idx >= 0) state.thali.sides.splice(idx, 1);
          else state.thali.sides.push(item);
        } else {
          state.thali[category] = state.thali[category]?.id === id ? null : item;
        }
        App.navigate("thali");
      },

      applyPreset(presetId) {
        const preset = THALI_PRESETS.find(p => p.id === presetId);
        if (!preset) return;
        state.thali = { rice: null, bread: null, dal: null, sabzi: null, protein: null, sides: [], dessert: null };
        preset.items.forEach(id => {
          for (const [cat, opts] of Object.entries(THALI_OPTIONS)) {
            const found = opts.find(o => o.id === id);
            if (found) {
              if (cat === "sides") state.thali.sides.push(found);
              else state.thali[cat] = found;
              break;
            }
          }
        });
        App.navigate("thali");
        showToast(t("Preset applied", "प्रीसेट लागू हो गया"));
      },

      addThaliToCart() {
        const { total } = thaliTotal();
        if (total === 0) return;
        const parts = [];
        ["rice", "bread", "dal", "sabzi", "protein", "dessert"].forEach(k => {
          if (state.thali[k]) parts.push(state.thali[k].name);
        });
        state.thali.sides.forEach(s => parts.push(s.name));
        state.cart.push({
          id: "custom-thali-" + Date.now(),
          name: t("Custom Thali", "कस्टम थाली"),
          price: total,
          qty: 1,
          img: "https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=400&fit=crop",
          custom: parts.join(", "),
          veg: !state.thali.protein || state.thali.protein.veg !== false
        });
        state.thali = { rice: null, bread: null, dal: null, sabzi: null, protein: null, sides: [], dessert: null };
        updateCartUI();
        showToast(t("Thali added to cart!", "थाली कार्ट में जुड़ गई!"));
        App.navigate("cart");
      },

      selectPayment(method) {
        state.paymentMethod = method;
        App.navigate("payment");
      },

      directAppPay(method) {
        if (!state.customerPhone) {
          App.openLoginModal('payment');
          return;
        }
        var total = cartTotal();
        state.paymentMethod = method;
        tryOpenSpecificUpi(method, total);
        setTimeout(function() {
          App.executeOrderPlacement(method, total);
        }, 3000);
      },

      executeOrderPlacement(method, total) {
        state.order = {
          id: "HM" + Math.floor(1000 + Math.random() * 9000),
          items: state.cart.slice(),
          subtotal: cartSubtotal(),
          gst: cartGst(),
          total: total,
          table: state.table,
          customerPhone: state.customerPhone,
          customerName: state.customerName,
          time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
          payment: method,
          status: 0
        };
        saveOrder(state.order);
        state.cart = [];
        state.paymentMethod = null;
        updateCartUI();
        App.navigate("order");
        showToast(t("Order placed!", "ऑर्डर हो गया!"));

        if (state.customerPhone && state.customerPhone.length >= 10) {
          setTimeout(function() {
            sendReceiptToWhatsApp(state.order, state.customerPhone);
          }, 1200);
        }

        [1,2,3,4,5].forEach(function(status, i) {
          setTimeout(function() {
            if (state.order) {
              state.orderStatus = status;
              updateStoredOrder(state.order.id, { status: status });
              if (state.screen === "order") App.navigate("order");
              if (status === 5) showToast(t("Food served! Enjoy", "खाना सर्व हो गया!"));
            }
          }, (i + 1) * 7000);
        });
      },

      confirmPayment() {
        if (!state.customerPhone) {
          App.openLoginModal('payment');
          return;
        }
        if (!state.paymentMethod || state.cart.length === 0) return;
        var total = cartTotal();

        if (["phonepe", "gpay", "paytm", "navi", "upi"].includes(state.paymentMethod)) {
          tryOpenSpecificUpi(state.paymentMethod, total);
          setTimeout(function() {
            App.executeOrderPlacement(state.paymentMethod, total);
          }, 2500);
          return;
        }

        showToast(t("Placing order...", "ऑर्डर हो रहा है..."));
        setTimeout(function() {
          App.executeOrderPlacement(state.paymentMethod, total);
        }, 1000);
      },

      sendWhatsAppDirect(orderId) {
        var orders = loadOrders();
        var o = orders.find(x => x.id === orderId) || state.order;
        if (!o) return;
        sendReceiptToWhatsApp(o, o.customerPhone || state.customerPhone);
      },

      downloadBillImage() {
        var element = document.getElementById("printable-receipt");
        if (!element) return;
        showToast(t("Generating Bill Image...", "बिल इमेज बन रही है..."));
        html2canvas(element, { scale: 2, backgroundColor: "#fffef8" }).then(function(canvas) {
          var link = document.createElement("a");
          link.download = "Hotel_Muskan_Bill_" + Date.now() + ".png";
          link.href = canvas.toDataURL("image/png");
          link.click();
          showToast(t("Bill Image Saved!", "बिल इमेज सेव हो गई!"));
        }).catch(function(err) {
          console.error(err);
          showToast("Error creating image");
        });
      },

      printPaperReceipt(orderId) {
        const orders = loadOrders();
        const o = orders.find(x => x.id === orderId) || state.order;
        if (!o) return;
        const modal = document.getElementById("modal-container");
        modal.innerHTML = `
          <div class="w-full max-w-xs my-auto">
            <div id="printable-receipt" class="receipt-paper p-5 rounded-lg text-xs shadow-2xl">
              <div class="text-center font-bold text-sm mb-1">HOTEL MUSKAN</div>
              <div class="text-center text-[10px] mb-2">Bhagwanpur, Vaishali, Bihar<br/>GSTIN: 10AABCM5670P1Z1</div>
              <div class="border-b border-dashed border-black my-2"></div>
              <div class="flex justify-between"><span>Bill No: ${o.id}</span><span>Table: ${o.table}</span></div>
              <div class="flex justify-between"><span>Guest: ${o.customerName || 'Customer'}</span><span>Phone: ${o.customerPhone || 'N/A'}</span></div>
              <div class="flex justify-between"><span>Date: ${o.time || 'Today'}</span><span>Mode: ${(o.payment||'CASH').toUpperCase()}</span></div>
              <div class="border-b border-dashed border-black my-2"></div>
              <div class="space-y-1">
                ${(o.items || []).map(it => `
                  <div class="flex justify-between">
                    <span>${it.qty}x ${it.name.substring(0, 15)}</span>
                    <span>₹${it.price * it.qty}</span>
                  </div>
                `).join('')}
              </div>
              <div class="border-b border-dashed border-black my-2"></div>
              <div class="flex justify-between font-bold text-sm mt-1"><span>Total Paid:</span><span>₹${o.total}</span></div>
              <div class="text-center text-[10px] mt-4">Thank You! Visit Again<br/>Call: +91 96086 35670</div>
            </div>

            <div class="space-y-2 mt-3">
              <button onclick="App.downloadBillImage()" class="w-full bg-blue-600 text-white py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1">
                📷 Save Bill as Image (PNG)
              </button>
              <div class="flex gap-2">
                <button onclick="App.sendWhatsAppDirect('${o.id}')" class="flex-1 bg-green-600 text-white py-2 rounded-xl font-bold text-[11px]">WHATSAPP BILL</button>
                <button onclick="window.print()" class="flex-1 bg-neutral-800 border border-yellow-500/40 text-yellow-400 py-2 rounded-xl font-bold text-[11px]">PRINT</button>
              </div>
              <button onclick="App.closeModal()" class="w-full text-center text-xs py-1 text-stone-400 underline">Close</button>
            </div>
          </div>
        `;
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      },

      simulateQR() {
        const modal = document.getElementById("modal-container");
        modal.innerHTML = `
          <div class="bg-neutral-900 border border-gold-500/40 rounded-2xl p-5 w-full max-w-xs text-white text-center my-auto">
            <h3 class="font-bold text-sm mb-2 text-yellow-400">Select Active Table</h3>
            <div class="grid grid-cols-4 gap-2 mb-4">
              ${TABLES.slice(0, 12).map(tbl => `
                <button onclick="App.setTable('${tbl.id}')" class="p-2 rounded-xl text-xs font-bold border ${state.table === tbl.id ? 'bg-gold-500 text-black' : 'bg-neutral-800 border-yellow-500/20'}">${tbl.id.replace('TABLE-','')}</button>
              `).join('')}
            </div>
            <button onclick="App.closeModal()" class="w-full py-2 bg-neutral-800 rounded-xl text-xs">Cancel</button>
          </div>
        `;
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      },

      setTable(tblId) {
        state.table = tblId;
        document.getElementById("table-display-pill").textContent = tblId;
        App.closeModal();
        showToast(`${t("Connected to ", "टेबल बदला: ")}${tblId}`);
        App.navigate(state.screen);
      },

      clearCart() {
        state.cart = [];
        updateCartUI();
        App.navigate("cart");
        showToast(t("Cart cleared", "कार्ट खाली"));
      },

      randomThali() {
        var picks = {};
        ["rice", "bread", "dal", "sabzi", "protein", "dessert"].forEach(function(k) {
          var opts = (THALI_OPTIONS[k] || []).filter(function(o) { return o.price > 0; });
          if (opts.length) picks[k] = opts[Math.floor(Math.random() * opts.length)];
        });
        state.thali = {
          rice: picks.rice || null,
          bread: picks.bread || null,
          dal: picks.dal || null,
          sabzi: picks.sabzi || null,
          protein: picks.protein || null,
          sides: [],
          dessert: picks.dessert || null
        };
        App.navigate("thali");
        showToast("🎲 " + t("Surprise Thali ready!", "सरप्राइज़ थाली तैयार!"));
      },

      requestWater() { showToast("💧 " + t("Water requested — waiter notified", "पानी का अनुरोध — भेजा गया")); },
      requestWaiter() { showToast("🙋 " + t("Waiter called to your table", "वेटर को सूचित किया गया")); },

      openAdmin() {
        var pin = prompt(t("Admin PIN", "एडमिन पिन"), "");
        if (pin === null) return;
        if (pin !== "1234" && pin !== "muskan") {
          showToast(t("Wrong PIN", "गलत पिन"));
          return;
        }
        App.navigate("admin");
      },

      adminSetStatus(orderId, statusNum) {
        state.orderStatus = statusNum;
        updateStoredOrder(orderId, { status: statusNum });
        if (state.order && state.order.id === orderId) state.orderStatus = statusNum;
        showToast(t("Status updated", "स्टेटस अपडेट"));
        App.navigate("admin");
      },

      adminClearOrders() {
        if (!confirm(t("Clear all orders?", "सभी ऑर्डर मिटाएँ?"))) return;
        localStorage.setItem("muskan_orders", "[]");
        showToast(t("Orders cleared", "ऑर्डर क्लियर"));
        App.navigate("admin");
      },

      toggleLang() {
        state.lang = state.lang === "en" ? "hi" : "en";
        App.navigate(state.screen);
      }
    };

    // ========== INIT ==========
    try {
      var langBtn = document.getElementById("lang-btn");
      if (langBtn) langBtn.addEventListener("click", function() { App.toggleLang(); });
      var cartBtn = document.getElementById("floating-cart");
      if (cartBtn) cartBtn.addEventListener("click", function() { App.navigate("cart"); });
      document.querySelectorAll(".nav-btn").forEach(function(btn) {
        btn.addEventListener("click", function() { App.navigate(btn.dataset.screen); });
      });
    } catch (e) { console.error(e); }

    // Start App Flow: Loading -> Login -> Main Screen
    App.initAppFlow();
  })();
  </script>
</body>
</html>
