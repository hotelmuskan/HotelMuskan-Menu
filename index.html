<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Muskan | Admin Control Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #c5a059; --bg: #050505; --card: rgba(255, 255, 255, 0.03); }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg); color:#fff; overflow-x:hidden; scroll-behavior: smooth; }

        header {
            height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://img.sanishtech.com/u/2cc752957680715b28014785956091e8.webp');
            background-size: cover; background-position: center; border-bottom: 5px solid var(--gold);
        }
        header h1 { font-family: 'Cinzel', serif; font-size: 3.5rem; color: var(--gold); }

        .container { padding: 40px 5%; max-width: 1200px; margin: auto; }
        .section-title { color:var(--gold); margin:40px 0 20px; font-family:'Cinzel'; font-size: 1.8rem; border-left: 5px solid var(--gold); padding-left: 15px; }
        
        /* MENU CARD STYLE */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .food-card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; transition: 0.3s; }
        .food-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .price-tag { color: var(--gold); font-weight: 900; margin-bottom: 15px; display: block; }
        
        .btn-group { display: flex; gap: 10px; }
        .add-btn { flex: 1; background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 10px; cursor: pointer; font-weight: 800; font-size: 0.7rem; }
        .add-btn:hover { background: var(--gold); color: #000; }

        /* ADMIN PANEL STYLE */
        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; padding: 50px 5%; overflow-y: auto; }
        .admin-item { background: #111; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; }
        input { background: #222; border: 1px solid var(--gold); color: #fff; padding: 8px; width: 80px; text-align: center; border-radius: 5px; }
        .save-btn { background: var(--gold); color: #000; border: none; padding: 15px 30px; font-weight: 900; cursor: pointer; border-radius: 5px; margin-top: 20px; }

        .checkout-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: #fff; color: #000; padding: 20px; border-radius: 15px; display: none; justify-content: space-between; align-items: center; z-index: 1000; }
        .admin-toggle { text-align: center; padding: 20px; color: #333; cursor: pointer; font-size: 0.6rem; }
    </style>
</head>
<body onload="loadPrices()">

<header>
    <h1>Hotel Muskan</h1>
    <p style="letter-spacing: 3px; font-style: italic;">A TASTE YOU'LL REMEMBER</p>
</header>

<div class="container" id="menu-container">
    </div>

<div id="admin-panel">
    <h2 style="font-family: 'Cinzel'; color: var(--gold); margin-bottom: 30px;">Admin Price Control</h2>
    <div id="admin-items-list"></div>
    <button class="save-btn" onclick="saveAllPrices()">SAVE CHANGES & GO LIVE</button>
    <button onclick="toggleAdmin()" style="background:none; color:grey; border:none; margin-top:20px; cursor:pointer;">Close Dashboard</button>
</div>

<div class="checkout-bar" id="cart">
    <div style="font-weight:900;">Total Bill: ₹<span id="bill-total">0</span></div>
    <button onclick="sendOrder()" style="background:#000; color:#fff; border:none; padding:10px 20px; border-radius:8px; font-weight:900;">Order on WhatsApp</button>
</div>

<div class="admin-toggle" onclick="toggleAdmin()">© Admin Access</div>

<script>
    // Initial Menu Data
    let menuData = [
        { id: "pdp", name: "Paneer Do Pyaza", full: 240, half: 120, cat: "Paneer" },
        { id: "pb", name: "Paneer Butter", full: 260, half: 130, cat: "Paneer" },
        { id: "cdp", name: "Chicken Do Pyaza", full: 260, half: 130, cat: "Non-Veg" },
        { id: "cc", name: "Chicken Curry", full: 180, half: 90, cat: "Non-Veg" },
        { id: "roti", name: "Plain Roti", full: 6, half: 0, cat: "Breads", isSingle: true }
    ];

    let cart = {}; let total = 0;

    function loadPrices() {
        // Check if prices are already saved in browser
        const saved = localStorage.getItem('muskanPrices');
        if(saved) menuData = JSON.parse(saved);
        renderMenu();
    }

    function renderMenu() {
        let html = "";
        let currentCat = "";
        menuData.forEach(item => {
            if(item.cat !== currentCat) {
                currentCat = item.cat;
                html += `<h2 class="section-title">${currentCat}</h2><div class="grid">`;
            }
            html += `
                <div class="food-card">
                    <h3>${item.name}</h3>
                    <span class="price-tag">Full: ₹${item.full} ${item.half > 0 ? '| Half: ₹'+item.half : ''}</span>
                    <div class="btn-group">
                        <button class="add-btn" onclick="addToCart('${item.name} (F)', ${item.full})">ADD FULL</button>
                        ${item.half > 0 ? `<button class="add-btn" onclick="addToCart('${item.name} (H)', ${item.half})">ADD HALF</button>` : ''}
                    </div>
                </div>`;
        });
        document.getElementById('menu-container').innerHTML = html;
    }

    function toggleAdmin() {
        const panel = document.getElementById('admin-panel');
        if(panel.style.display === 'block') {
            panel.style.display = 'none';
        } else {
            panel.style.display = 'block';
            renderAdminList();
        }
    }

    function renderAdminList() {
        let html = "";
        menuData.forEach((item, index) => {
            html += `
                <div class="admin-item">
                    <span>${item.name}</span>
                    <div>
                        F: <input type="number" id="f-${index}" value="${item.full}"> 
                        ${item.half > 0 ? `H: <input type="number" id="h-${index}" value="${item.half}">` : ''}
                    </div>
                </div>`;
        });
        document.getElementById('admin-items-list').innerHTML = html;
    }

    function saveAllPrices() {
        menuData.forEach((item, index) => {
            item.full = parseInt(document.getElementById(`f-${index}`).value);
            if(item.half > 0) item.half = parseInt(document.getElementById(`h-${index}`).value);
        });
        localStorage.setItem('muskanPrices', JSON.stringify(menuData));
        alert("Prices Updated Successfully!");
        toggleAdmin();
        renderMenu();
    }

    function addToCart(name, price) {
        total += price; cart[name] = (cart[name] || 0) + 1;
        document.getElementById('bill-total').innerText = total;
        document.getElementById('cart').style.display = 'flex';
    }

    function sendOrder() {
        let msg = "🍱 *HOTEL MUSKAN ORDER*%0A";
        for(let key in cart) msg += `${key} x ${cart[key]}%0A`;
        msg += `%0A💰 *Total: ₹${total}*`;
        window.open(`https://wa.me/919608635670?text=${msg}`);
    }
</script>
</body>
</html>
